server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Don't advertise the nginx version; cap request bodies (template imports are well under 5 MB).
    server_tokens off;
    client_max_body_size 5m;

    # Security headers for every response. (Locations below must not use add_header, or these are dropped.)
    # CSP: our own scripts only; Google Fonts; YouTube/Vimeo players; react-native-web needs inline styles.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; frame-src https://www.youtube-nocookie.com https://www.youtube.com https://player.vimeo.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # The backend sets its own (stricter) versions of these; avoid sending them twice.
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
    }

    # Content-hashed bundles never change: cache them for a year.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location / {
        # index.html must not be cached, so a deploy is picked up on the next visit.
        expires -1;
        try_files $uri /index.html;
    }
}
