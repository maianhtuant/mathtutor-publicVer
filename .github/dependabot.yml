# Weekly update PRs for known-vulnerable or outdated dependencies.
# PRs never deploy by themselves: only merging into main runs the deploy workflow.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /backend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: bun
    directory: /frontend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /math-service
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directories: [/backend, /frontend, /math-service]
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
