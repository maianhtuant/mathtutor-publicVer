name: Deploy GED Tutor

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gedtutor-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.EC2_SSH_KEY }}
          HOST_KEYS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$HOST_KEYS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: Update and deploy
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            "ubuntu@$EC2_HOST" 'bash -se' <<'REMOTE'
          cd /home/ubuntu/mathtutor-new

          test "$(git branch --show-current)" = "main"
          # compose.production.yml used to exist only on the server; move that untracked copy aside once,
          # or the pull would refuse to overwrite it.
          if [ -f compose.production.yml ] && ! git ls-files --error-unmatch compose.production.yml >/dev/null 2>&1; then
            mv compose.production.yml "compose.production.yml.server-$(date +%Y%m%d%H%M%S)"
          fi
          # Preserve server ignore rules before pulling.
          if ! git diff --quiet HEAD -- .gitignore; then
            cat .gitignore >> "$(git rev-parse --git-path info/exclude)"
            git stash push -m "deploy: preserve server gitignore before pull" -- .gitignore
          fi
          GIT_TERMINAL_PROMPT=0 git pull --ff-only origin main

          dc() {
            sudo -n docker compose \
              -p mathtutor-prod \
              --env-file .env.production \
              -f compose.production.yml "$@"
          }

          dc config --quiet
          dc build backend
          dc build math-service frontend
          dc up -d --wait --wait-timeout 240

          curl --fail --silent --show-error \
            --max-time 20 http://127.0.0.1:3000/api/health
          REMOTE
