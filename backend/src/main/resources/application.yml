spring:
  application:
    name: mathtutor-backend
  # WildFly exposes java:comp/UserTransaction, which would make Spring pick a JTA transaction manager.
  # Our Hikari pool is not enlisted in JTA, so @Transactional would silently stop rolling back.
  # Use the plain JDBC transaction manager instead.
  jta:
    enabled: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mathtutor}
    username: ${DB_USERNAME:mathtutor}
    password: ${DB_PASSWORD:mathtutor}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: always
  mvc:
    problemdetails:
      enabled: false

server:
  port: ${PORT:8080}
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-secret-of-32+-bytes}
    ttl-minutes: ${JWT_TTL_MINUTES:480}
  math-service:
    url: ${MATH_SERVICE_URL:http://localhost:8000}
    api-key: ${MATH_SERVICE_API_KEY:}
    timeout-seconds: ${MATH_SERVICE_TIMEOUT_SECONDS:30}
  seed:
    enabled: ${SEED_ENABLED:true}
    admin-email: ${ADMIN_EMAIL:admin@mathtutor.local}
    admin-password: ${ADMIN_PASSWORD:Admin@123}
    demo-data: ${SEED_DEMO_DATA:true}
  cors-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:8081}
  expiration-interval-ms: ${EXPIRATION_INTERVAL_MS:30000}

logging:
  level:
    com.mathtutor: INFO
