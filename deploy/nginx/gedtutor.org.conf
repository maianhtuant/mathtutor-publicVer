# Copy of the host nginx site on the EC2 server (/etc/nginx/sites-enabled/). Reference only: deploys don't install it.
# The "managed by Certbot" lines are written by `certbot --nginx`; keep them when editing on the server.
# proxy_pass must match the frontend port in compose.production.yml (127.0.0.1:3000).
server {
    server_name gedtutor.org www.gedtutor.org;

    location / {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/gedtutor.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/gedtutor.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.gedtutor.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = gedtutor.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name gedtutor.org www.gedtutor.org;
    return 404; # managed by Certbot
}
